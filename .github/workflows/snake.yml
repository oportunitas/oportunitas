name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oportunitas
          outputs: |
            dist/github-snake.svg?palette=9dcfd9,1e2729,131b1c,275963,8fc1cb,b9ecf7
            dist/github-snake-dark.svg?palette=9dcfd9,1e2729,131b1c,275963,8fc1cb,b9ecf7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
