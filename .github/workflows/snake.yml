name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: oportunitas
          outputs: |
            dist/github-snake.svg?color_snake=%23275963&color_dots=%23ebf4f6,%23c8e2e7,%239dcfd9,%235fa3b0,%23275963
            dist/github-snake-dark.svg?color_snake=%239dcfd9&color_dots=%231e2729,%23275963,%234a8a96,%2373b3bf,%23b9ecf7

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
